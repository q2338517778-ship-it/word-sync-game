<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同频 · 双人词语默契挑战</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f7f7fc;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 15%,#29305b 0,transparent 39%),radial-gradient(circle at 85% 75%,#35214c 0,transparent 38%),#0b1020}main{max-width:740px;padding:42px 20px 70px;margin:auto}.eyebrow{color:#a5adcf;font-size:13px;letter-spacing:4px;text-transform:uppercase;text-align:center}.logo{text-align:center;font-size:clamp(42px,9vw,72px);font-weight:850;letter-spacing:5px;margin:10px 0 4px}.logo span{color:#aa96ff}.sub{text-align:center;color:#aeb3ce;margin:0 0 30px;line-height:1.8}.panel{background:rgba(23,28,49,.9);border:1px solid #353b5e;box-shadow:0 18px 65px #0609167a;border-radius:26px;padding:30px;min-height:200px}.flex{display:flex;gap:12px}.flex>*{flex:1}.hide{display:none!important}label{display:block;color:#c4c8df;margin:18px 0 8px;font-size:14px}input,select{width:100%;background:#0d1428;border:1px solid #424a6e;border-radius:13px;color:#fff;padding:14px 15px;font:inherit;outline:none}input:focus,select:focus{border-color:#ad9bff;box-shadow:0 0 0 3px #a58dff27}button{border:0;border-radius:14px;font:inherit;font-weight:750;cursor:pointer;padding:14px 19px;transition:transform .15s,opacity .15s}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}.primary{color:#15102c;background:linear-gradient(115deg,#c6b5ff,#8ca4ff)}.secondary{color:#e2dfff;background:#35395d}.ghost{background:transparent;border:1px solid #535978;color:#dedaf8}.wide{width:100%;margin-top:20px}.tabs{display:flex;gap:8px;padding:5px;background:#11182e;border-radius:14px;margin-bottom:22px}.tabs button{flex:1;background:transparent;color:#9da5c5}.tabs button.active{background:#343858;color:white}.tiny{font-size:13px;color:#aab1ce;line-height:1.7}.error{color:#ffc0cb;min-height:22px;text-align:center;margin-top:14px}.topline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.chip{background:#303452;border:1px solid #565b83;border-radius:999px;color:#cdc9fa;padding:7px 13px;font-size:13px}.center{text-align:center}h2{font-size:27px;margin:22px 0 8px}.headline{font-size:22px;font-weight:700}.muted{color:#a7afcc}.timer{font-size:64px;font-weight:850;letter-spacing:-3px;line-height:1.15;margin:12px 0;color:#c8bdff}.timer.urgent{color:#ff999f}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.player{background:#11182e;border:1px solid #373f62;border-radius:19px;padding:19px 10px;min-height:128px}.player .name{color:#c3c8e4;font-size:14px;overflow-wrap:anywhere}.player .answer{font-size:clamp(18px,4vw,29px);font-weight:800;min-height:45px;margin:16px 0 0;overflow-wrap:anywhere}.good{color:#83e2ba}.wait{color:#b6bbd0}.divider{height:1px;background:#353c5c;margin:24px 0}.code{font-size:34px;letter-spacing:7px;font-weight:800;color:#d0c1ff;margin:9px 0}.success{font-size:55px;margin:8px}.footer{text-align:center;color:#858dad;margin-top:25px;font-size:12px}.spacer{height:10px}@media(max-width:520px){main{padding-top:28px}.panel{padding:22px}.timer{font-size:56px}.players{gap:8px}.player{padding:15px 8px}}
</style></head><body><main><div class="eyebrow">TWO MINDS · ONE WORD</div><div class="logo">同<span>频</span></div><p class="sub">不约而同，想到同一个词。<br>你们需要多少轮才能心有灵犀？</p>
<section id="home" class="panel"><div class="tabs"><button id="createTab" class="active" onclick="setTab('create')">创建房间</button><button id="joinTab" onclick="setTab('join')">加入房间</button></div><label for="nickname">你的昵称</label><input id="nickname" maxlength="18" placeholder="比如：小明" autocomplete="nickname"><div id="createInputs"><label for="seconds">每轮思考时间</label><select id="seconds"><option value="15">15 秒 · 闪电战</option><option value="30" selected>30 秒 · 刚刚好</option><option value="45">45 秒</option><option value="60">60 秒 · 轻松想</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option></select></div><div id="joinInputs" class="hide"><label for="roomCode">六位房间码</label><input id="roomCode" maxlength="6" placeholder="例如 A1B2C3" autocapitalize="characters" style="text-transform:uppercase"></div><button class="primary wide" id="enterBtn" onclick="enter()">创建房间</button><p class="tiny center">两人各自秘密填写一个词。双方提交后同时揭晓；<br>不一样就继续，直到想到同一个词！</p></section>
<section id="game" class="panel hide"><div class="topline"><span class="chip" id="phaseLabel">等待加入</span><span class="chip" id="roundLabel">准备中</span></div><div id="lobby" class="center hide"><h2>邀请好友来挑战</h2><p class="muted">把房间码或邀请链接发给另一位玩家</p><div class="code" id="inviteCode"></div><button class="secondary" onclick="copyInvite()">复制邀请链接</button><div class="players" id="lobbyPlayers"></div><p class="tiny" id="lobbyTip"></p><button id="startBtn" class="primary wide" onclick="action('/api/start')">两人到齐，开始游戏</button></div>
<div id="writing" class="center hide"><h2>你会想到哪个词？</h2><p class="muted">输入时彼此看不见 · 两人提交后一起揭晓</p><div class="timer" id="countdown">30</div><form onsubmit="submitWord(event)"><input id="word" maxlength="40" placeholder="写下你想到的词…" autocomplete="off" spellcheck="false" aria-label="本轮词语"><button class="primary wide" id="submitBtn" type="submit">锁定我的词语 🔒</button></form><p class="tiny" id="writingTip">提交后不可修改，等待对方完成</p><div class="players" id="writingPlayers"></div></div>
<div id="reveal" class="center hide"><h2 id="revealTitle">不一样，再来一轮！</h2><p class="muted" id="revealSub">看看彼此想到了什么</p><div class="players" id="revealPlayers"></div><p class="tiny" id="nextTip">5 秒后自动进入下一轮…</p></div>
<div id="won" class="center hide"><div class="success">🎉</div><h2>你们同频了！</h2><p id="winMessage" class="muted"></p><div class="players" id="wonPlayers"></div><button class="primary wide" id="replayBtn" onclick="action('/api/replay')">再玩一局</button></div>
<div class="divider"></div><div class="topline"><span id="connection" class="tiny">● 已连接</span><button class="ghost" onclick="leave()" style="padding:8px 12px;font-size:12px">退出房间</button></div></section>
<div class="error" id="error" role="alert"></div><div class="footer">同频 · 两个人的默契实验室</div></main>
<script>
let tab='create', token='', state=null, stream=null, timer=null;
const $=id=>document.getElementById(id);
function setTab(t){tab=t;$('createTab').classList.toggle('active',t==='create');$('joinTab').classList.toggle('active',t==='join');$('createInputs').classList.toggle('hide',t!=='create');$('joinInputs').classList.toggle('hide',t!=='join');$('enterBtn').textContent=t==='create'?'创建房间':'加入房间';$('error').textContent=''}
const initialCode=new URLSearchParams(location.search).get('room');if(initialCode){setTab('join');$('roomCode').value=initialCode.toUpperCase()}
function error(message){$('error').textContent=message;setTimeout(()=>{if($('error').textContent===message)$('error').textContent=''},5000)}
async function api(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw Error(out.error||'请求失败');return out}
async function enter(){try{const b={name:$('nickname').value.trim()};if(!b.name)throw Error('先输入昵称');const path=tab==='create'?'/api/create':'/api/join';if(tab==='create')b.seconds=Number($('seconds').value);else b.code=$('roomCode').value.trim();$('enterBtn').disabled=true;const r=await api(path,b);token=r.token;sessionStorage.setItem('word-sync-token',token);state=r.state;connect();render()}catch(e){error(e.message)}finally{$('enterBtn').disabled=false}}
async function action(path){try{await api(path,{token})}catch(e){error(e.message)}}
async function submitWord(event){event.preventDefault();try{const word=$('word').value.trim();if(!word)throw Error('请先写一个词语');$('submitBtn').disabled=true;await api('/api/submit',{token,word})}catch(e){$('submitBtn').disabled=false;error(e.message)}}
function connect(){stream?.close();stream=new EventSource('/api/events?token='+encodeURIComponent(token));stream.onmessage=e=>{state=JSON.parse(e.data);$('connection').textContent='● 实时连接中';render()};stream.onerror=()=>{$('connection').textContent='● 正在重连…'}}
function leave(){stream?.close();token='';state=null;sessionStorage.removeItem('word-sync-token');$('home').classList.remove('hide');$('game').classList.add('hide');$('error').textContent='';history.replaceState(null,'',location.pathname)}
function personCard(p,show){const el=document.createElement('div');el.className='player';const n=document.createElement('div');n.className='name';n.textContent=p.name+(p.isYou?' (你)':'');const a=document.createElement('div');a.className='answer';let value;if(show)value=p.word||'⏰ 未作答';else value=p.submitted?'✓ 已提交':'… 思考中';a.className+=' '+(p.submitted?'good':'wait');a.textContent=value;el.append(n,a);return el}
function showPlayers(id,show){const el=$(id);el.replaceChildren(...state.players.map(p=>personCard(p,show)))}
function render(){if(!state)return;$('home').classList.add('hide');$('game').classList.remove('hide');['lobby','writing','reveal','won'].forEach(id=>$(id).classList.toggle('hide',state.phase!==id));$('phaseLabel').textContent={lobby:'等待好友',writing:'秘密输入',reveal:'同时揭晓',won:'挑战成功'}[state.phase];$('roundLabel').textContent=state.round?'第 '+state.round+' 轮':'准备中';if(state.phase==='lobby'){$('inviteCode').textContent=state.code;showPlayers('lobbyPlayers',false);$('lobbyTip').textContent=state.players.length===1?'等待第二位玩家加入…':'两位玩家已到齐！';$('startBtn').classList.toggle('hide',!state.isHost);$('startBtn').disabled=!state.canStart}
if(state.phase==='writing'){showPlayers('writingPlayers',false);const me=state.players.find(p=>p.isYou);$('word').disabled=me.submitted;$('submitBtn').disabled=me.submitted;$('submitBtn').textContent=me.submitted?'已锁定，等待揭晓 ✓':'锁定我的词语 🔒';$('writingTip').textContent=me.submitted?'提交成功！对方看不到你的词语。':'时间结束时自动揭晓，未提交记为未作答。';if(!me.submitted)$('word').value='';updateTimer()}
if(state.phase==='reveal'){showPlayers('revealPlayers',true);$('revealTitle').textContent='想法不同，再来一轮！';updateTimer()}
if(state.phase==='won'){showPlayers('wonPlayers',true);$('winMessage').textContent='经过 '+state.round+' 轮，你们终于想到同一个词！';$('replayBtn').classList.toggle('hide',!state.isHost)}
if(!timer)timer=setInterval(updateTimer,100)}
function updateTimer(){if(!state)return;if(state.phase==='writing'){const remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));$('countdown').textContent=remain;$('countdown').classList.toggle('urgent',remain<=5)}else if(state.phase==='reveal'){$('nextTip').textContent=Math.max(0,Math.ceil((state.revealUntil-Date.now())/1000))+' 秒后自动进入下一轮…'}}
async function copyInvite(){const url=location.origin+location.pathname+'?room='+state.code;try{await navigator.clipboard.writeText(url);$('lobbyTip').textContent='✓ 邀请链接已复制'}catch{window.prompt('复制这个邀请链接',url)}}
(async()=>{const saved=sessionStorage.getItem('word-sync-token');if(saved){try{const res=await fetch('/api/state?token='+encodeURIComponent(saved));if(!res.ok)throw Error();state=await res.json();token=saved;connect();render()}catch{sessionStorage.removeItem('word-sync-token')}}})();
</script></body></html>
