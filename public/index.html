<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同频 · 双人词语默契挑战</title>
<style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f7f7fc;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 15%,#29305b 0,transparent 39%),radial-gradient(circle at 85% 75%,#35214c 0,transparent 38%),#0b1020}main{max-width:740px;padding:42px 20px 70px;margin:auto}.eyebrow{color:#a5adcf;font-size:13px;letter-spacing:4px;text-transform:uppercase;text-align:center}.logo{text-align:center;font-size:clamp(42px,9vw,72px);font-weight:850;letter-spacing:5px;margin:10px 0 4px}.logo span{color:#aa96ff}.sub{text-align:center;color:#aeb3ce;margin:0 0 30px;line-height:1.8}.panel{background:rgba(23,28,49,.9);border:1px solid #353b5e;box-shadow:0 18px 65px #0609167a;border-radius:26px;padding:30px;min-height:200px}.flex{display:flex;gap:12px}.flex>*{flex:1}.hide{display:none!important}label{display:block;color:#c4c8df;margin:18px 0 8px;font-size:14px}input,select{width:100%;background:#0d1428;border:1px solid #424a6e;border-radius:13px;color:#fff;padding:14px 15px;font:inherit;outline:none}input:focus,select:focus{border-color:#ad9bff;box-shadow:0 0 0 3px #a58dff27}button{border:0;border-radius:14px;font:inherit;font-weight:750;cursor:pointer;padding:14px 19px;transition:transform .15s,opacity .15s}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}.primary{color:#15102c;background:linear-gradient(115deg,#c6b5ff,#8ca4ff)}.secondary{color:#e2dfff;background:#35395d}.ghost{background:transparent;border:1px solid #535978;color:#dedaf8}.wide{width:100%;margin-top:20px}.tabs{display:flex;gap:8px;padding:5px;background:#11182e;border-radius:14px;margin-bottom:22px}.tabs button{flex:1;background:transparent;color:#9da5c5}.tabs button.active{background:#343858;color:white}.tiny{font-size:13px;color:#aab1ce;line-height:1.7}.error{color:#ffc0cb;min-height:22px;text-align:center;margin-top:14px}.topline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.chip{background:#303452;border:1px solid #565b83;border-radius:999px;color:#cdc9fa;padding:7px 13px;font-size:13px}.center{text-align:center}h2{font-size:27px;margin:22px 0 8px}.headline{font-size:22px;font-weight:700}.muted{color:#a7afcc}.timer{font-size:64px;font-weight:850;letter-spacing:-3px;line-height:1.15;margin:12px 0;color:#c8bdff}.timer.urgent{color:#ff999f}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.player{background:#11182e;border:1px solid #373f62;border-radius:19px;padding:19px 10px;min-height:128px}.player .name{color:#c3c8e4;font-size:14px;overflow-wrap:anywhere}.player .answer{font-size:clamp(18px,4vw,29px);font-weight:800;min-height:45px;margin:16px 0 0;overflow-wrap:anywhere}.history-card{margin:16px 0;padding:18px;text-align:left;background:#f4f0ff;color:#21173b;border:2px solid #b59bff;border-radius:18px;box-shadow:0 8px 28px #05081770}.history-card h3{margin:0 0 12px;color:#5631ae;font-size:17px}.history-row{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;align-items:center;padding:10px 8px;border-top:1px solid #d7c9ff}.history-row strong{color:#6241aa}.history-word{font-size:17px;font-weight:800;color:#17112a;overflow-wrap:anywhere}.history-modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#050817d9;padding:18px}.history-dialog{width:min(620px,100%);max-height:85vh;overflow:auto;background:#fff;color:#17112a;border:3px solid #9e7aff;border-radius:22px;padding:22px;box-shadow:0 24px 80px #000b}.history-dialog h2{color:#48239c}.history-dialog .history-row{background:#f6f2ff}.history-dialog .history-word{color:#17112a}.good{color:#83e2ba}.wait{color:#b6bbd0}.divider{height:1px;background:#353c5c;margin:24px 0}.code{font-size:34px;letter-spacing:7px;font-weight:800;color:#d0c1ff;margin:9px 0}.success{font-size:55px;margin:8px}.footer{text-align:center;color:#858dad;margin-top:25px;font-size:12px}.spacer{height:10px}@media(max-width:520px){main{padding-top:28px}.panel{padding:22px}.timer{font-size:56px}.players{gap:8px}.player{padding:15px 8px}}
.review-card{position:relative;overflow:hidden;margin:22px auto 14px;padding:22px 20px 24px;max-width:570px;color:#211322;text-align:center;border:4px solid #ffe65c;border-radius:24px;background:linear-gradient(145deg,#fff7b8,#ffbd65 52%,#ff7b72);box-shadow:0 12px 0 #9d4d74,0 22px 42px #03061199;transform:rotate(-1deg)}.review-label{display:inline-block;padding:7px 14px;border-radius:999px;background:#32173e;color:#fff;font-size:14px;font-weight:900;letter-spacing:1px}.review-emoji{margin:10px 0 2px;font-size:58px;line-height:1.1}.review-card p{margin:8px auto 0;max-width:460px;font-size:clamp(20px,4.7vw,29px);line-height:1.35;font-weight:950;color:#32172b}.review-stamp{position:absolute;right:18px;top:18px;transform:rotate(12deg);border:3px solid #d6245c;border-radius:50%;padding:6px;color:#b41b50;font-weight:1000;font-size:12px}</style></head><body><main><div class="eyebrow">TWO MINDS · ONE WORD</div><div class="logo">同<span>频</span></div><p class="sub">不约而同，想到同一个词。<br>你们需要多少轮才能心有灵犀？</p>
<section id="home" class="panel"><div class="tabs"><button id="createTab" class="active" onclick="setTab('create')">创建房间</button><button id="joinTab" onclick="setTab('join')">加入房间</button></div><label for="nickname">你的昵称</label><input id="nickname" maxlength="18" placeholder="比如：小明" autocomplete="nickname"><div id="createInputs"><label for="seconds">每轮思考时间</label><select id="seconds"><option value="15">15 秒 · 闪电战</option><option value="30" selected>30 秒 · 刚刚好</option><option value="45">45 秒</option><option value="60">60 秒 · 轻松想</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option></select></div><div id="joinInputs" class="hide"><label for="roomCode">六位房间码</label><input id="roomCode" maxlength="6" placeholder="例如 A1B2C3" autocapitalize="characters" style="text-transform:uppercase"></div><button class="primary wide" id="enterBtn" onclick="enter()">创建房间</button><p class="tiny center">两人各自秘密填写一个词。双方提交后同时揭晓；<br>不一样就继续，直到想到同一个词！</p></section>
<section id="game" class="panel hide"><div class="topline"><span class="chip" id="phaseLabel">等待加入</span><span class="chip" id="roundLabel">准备中</span></div><div id="lobby" class="center hide"><h2>邀请好友来挑战</h2><p class="muted">把房间码或邀请链接发给另一位玩家</p><div class="code" id="inviteCode"></div><button class="secondary" onclick="copyInvite()">复制邀请链接</button><div class="players" id="lobbyPlayers"></div><p class="tiny" id="lobbyTip"></p><button id="startBtn" class="primary wide" onclick="action('/api/start')">两人到齐，开始游戏</button></div>
<div id="writing" class="center hide"><h2>你会想到哪个词？</h2><p class="muted">输入时彼此看不见 · 两人提交后一起揭晓</p><div id="previousRound" class="history-card hide"></div><div class="timer" id="countdown">30</div><form onsubmit="submitWord(event)"><input id="word" maxlength="40" placeholder="写下你想到的词…" autocomplete="off" spellcheck="false" aria-label="本轮词语"><button class="primary wide" id="submitBtn" type="submit">锁定我的词语 🔒</button></form><p class="tiny" id="writingTip">提交后不可修改，等待对方完成</p><div class="players" id="writingPlayers"></div></div>
<div id="reveal" class="center hide"><h2 id="revealTitle">不一样，再来一轮！</h2><p class="muted" id="revealSub">看看彼此想到了什么</p><div class="players" id="revealPlayers"></div><button class="ghost" onclick="showHistory()">查看上一轮词语</button><p class="tiny" id="nextTip">5 秒后自动进入下一轮…</p></div>
<div id="won" class="center hide"><div class="success">🎉</div><h2>你们同频了！</h2><div class="review-card"><div class="review-stamp">认证<br>默契</div><div class="review-label">🤖 AI 默契点评 · 最终词语：<span id="reviewWord"></span></div><div class="review-emoji" id="reviewEmoji">🤣</div><p id="winMessage"></p></div><div class="players" id="wonPlayers"></div><button class="secondary" onclick="showHistory()">查看每轮词语</button><button class="ghost" onclick="downloadHistory()">下载对局记录</button><button class="primary wide" id="replayBtn" onclick="action('/api/replay')">再玩一局</button></div>

<div class="divider"></div><div class="topline"><span id="connection" class="tiny">● 已连接</span><button class="ghost" onclick="leave()" style="padding:8px 12px;font-size:12px">退出房间</button></div></section>
<div id="historyModal" class="history-modal hide" onclick="if(event.target===this)closeHistory()"><section class="history-dialog"><h2 class="center">词语回顾</h2><div id="historyList"></div><button class="primary wide" onclick="closeHistory()">收起</button></section></div><div class="error" id="error" role="alert"></div><div class="footer">同频 · 两个人的默契实验室</div></main>
<script>
let tab='create', token='', state=null, stream=null, timer=null;
const $=id=>document.getElementById(id);
function setTab(t){tab=t;$('createTab').classList.toggle('active',t==='create');$('joinTab').classList.toggle('active',t==='join');$('createInputs').classList.toggle('hide',t!=='create');$('joinInputs').classList.toggle('hide',t!=='join');$('enterBtn').textContent=t==='create'?'创建房间':'加入房间';$('error').textContent=''}
const initialCode=new URLSearchParams(location.search).get('room');if(initialCode){setTab('join');$('roomCode').value=initialCode.toUpperCase()}
function error(message){$('error').textContent=message;setTimeout(()=>{if($('error').textContent===message)$('error').textContent=''},5000)}
async function api(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw Error(out.error||'请求失败');return out}
async function enter(){try{const b={name:$('nickname').value.trim()};if(!b.name)throw Error('先输入昵称');const path=tab==='create'?'/api/create':'/api/join';if(tab==='create')b.seconds=Number($('seconds').value);else b.code=$('roomCode').value.trim();$('enterBtn').disabled=true;const r=await api(path,b);token=r.token;sessionStorage.setItem('word-sync-token',token);state=r.state;connect();render()}catch(e){error(e.message)}finally{$('enterBtn').disabled=false}}
async function action(path){try{await api(path,{token})}catch(e){error(e.message)}}
async function submitWord(event){event.preventDefault();try{const word=$('word').value.trim();if(!word)throw Error('请先写一个词语');$('submitBtn').disabled=true;await api('/api/submit',{token,word})}catch(e){$('submitBtn').disabled=false;error(e.message)}}
function connect(){stream?.close();stream=new EventSource('/api/events?token='+encodeURIComponent(token));stream.onmessage=e=>{state=JSON.parse(e.data);$('connection').textContent='● 实时连接中';render()};stream.onerror=()=>{$('connection').textContent='● 正在重连…'}}
function leave(){stream?.close();token='';state=null;sessionStorage.removeItem('word-sync-token');$('home').classList.remove('hide');$('game').classList.add('hide');$('error').textContent='';history.replaceState(null,'',location.pathname)}
function personCard(p,show){const el=document.createElement('div');el.className='player';const n=document.createElement('div');n.className='name';n.textContent=p.name+(p.isYou?' (你)':'');const a=document.createElement('div');a.className='answer';let value;if(show)value=p.word||'⏰ 未作答';else value=p.submitted?'✓ 已提交':'… 思考中';a.className+=' '+(p.submitted?'good':'wait');a.textContent=value;el.append(n,a);return el}
function showPlayers(id,show){const el=$(id);el.replaceChildren(...state.players.map(p=>personCard(p,show)))}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function historyRows(rows){return rows.map(r=>'<div class="history-row"><strong>第 '+r.round+' 轮</strong><span class="history-word">'+escapeHtml(r.words?.[0]||'未作答')+'</span><span class="history-word">'+escapeHtml(r.words?.[1]||'未作答')+'</span></div>').join('')}
function renderPrevious(){const box=$("previousRound"),prev=(state.history||[]).at(-1);if(state.phase==='writing'&&prev){box.innerHTML='<h3>上一轮 · 双方词语</h3>'+historyRows([prev]);box.classList.remove('hide')}else box.classList.add('hide')}
function historyText(){const names=state.players.map(p=>p.name);return ['同频对局记录 · 房间 '+state.code,'轮次\t'+names.join('\t'),...state.history.map(r=>'第 '+r.round+' 轮\t'+(r.words?.[0]||'未作答')+'\t'+(r.words?.[1]||'未作答')+(r.matched?'\t✓ 匹配':''))].join('\n')}
function showHistory(){$('historyList').innerHTML=historyRows(state.history||[])||'<p>暂无已揭晓轮次</p>';$('historyModal').classList.remove('hide')}
function closeHistory(){$('historyModal').classList.add('hide')}
function funnyReview(){if(state.review)return state.review;const n=state.round,word=String(state.history?.[state.history.length-1]?.words?.[0]||'这个词');const groups=[[/猫|狗|宠物|喵|汪/,['🐱😹','听到“'+word+'”，AI当场开始学叫，职业素养暂时离线！'],['🐶💖','共同答案是“'+word+'”？汪汪队确认：这就是爱！']],[/吃|饭|奶茶|火锅| pizza|披萨|面|饿|食物/,['🍜🤤','你们想到“'+word+'”的速度，像是都刚好没吃午饭！'],['🧋😋','AI识别到“'+word+'”：两位玩家的胃比大脑先同步了！']],[/钱|发财|工资|红包|购物|买/,['💸🤑','共同想到“'+word+'”，默契里透着一点点现实主义！'],['🧧✨','AI建议：既然都想到“'+word+'”，这局奖金请平分！']],[/工作|上班|老板|加班|会议|打工/,['💻😭','共同答案“'+word+'”一出，AI也想申请下班了！'],['☕😵','你们想到“'+word+'”时，工位上的咖啡同时叹了口气！']],[/爱|恋|约会|对象|结婚|心动/,['💘🥹','共同想到“'+word+'”，这默契已经开始冒粉红泡泡了！'],['🫶😳','AI点评“'+word+'”：建议两位把这份默契续费到下一局！']],[/游戏|赢|输|队友|开黑|王者|游戏/,['🎮🔥','共同答案“'+word+'”！这波配合可以直接进高光集锦！']],[/睡|床|梦|休息|困/,['😴💤','你们想到“'+word+'”的默契，像是梦里排练过一样！']]];for(const [re,...opts] of groups)if(re.test(word))return opts[Math.floor(Math.random()*opts.length)];const fallback=[['📶😂','你们的脑电波终于从 Wi‑Fi 连成了蓝牙！'],['🤝😆','前面 '+Math.max(0,n-1)+' 轮是在热身，最后终于想到了“'+word+'”！'],['🧠✨','大脑同步成功：共同答案“'+word+'”已高亮收藏！'],['🐢💨','不是心有灵犀，是灵犀终于赶上了“'+word+'”！'],['🏆🤣','隐藏成就解锁：两个人同时说出“'+word+'”！']];return fallback[Math.floor(Math.random()*fallback.length)]}
function roundedRect(ctx,x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function downloadHistory(){const w=1080,pad=72,rowH=130,headH=380,footH=150,h=headH+state.history.length*rowH+footH;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#151a38');g.addColorStop(1,'#3b2867');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#c7b5ff';x.font='700 30px system-ui';x.fillText('TWO MINDS · ONE WORD',pad,90);x.fillStyle='#fff';x.font='900 76px system-ui';x.fillText('同频战绩卡',pad,190);x.fillStyle='#d8d4ef';x.font='32px system-ui';x.fillText('房间 '+state.code+'  ·  共 '+state.round+' 轮',pad,250);x.fillStyle='#ffe69a';x.font='36px system-ui';x.fillText(funnyReview(),pad,320,{maxWidth:w-pad*2});roundedRect(x,pad,headH-20,w-pad*2,2,1,'#ffffff55');x.fillStyle='#c9bbff';x.font='700 27px system-ui';x.fillText('轮次',pad+10,headH+42);x.fillText(state.players[0]?.name||'玩家 1',pad+180,headH+42);x.fillText(state.players[1]?.name||'玩家 2',pad+590,headH+42);state.history.forEach((r,i)=>{const y=headH+rowH*(i+1);roundedRect(x,pad,y-rowH+58,w-pad*2,rowH-12,22,i%2?'#ffffff':'#f0eaff');x.fillStyle='#6c4bb5';x.font='700 28px system-ui';x.fillText('第 '+r.round+' 轮',pad+12,y+4);x.fillStyle='#17112a';x.font='800 32px system-ui';x.fillText(r.words?.[0]||'未作答',pad+180,y+4,360);x.fillText(r.words?.[1]||'未作答',pad+590,y+4,360);if(r.matched){x.fillStyle='#16845b';x.font='700 23px system-ui';x.fillText('✓ 同频',w-pad-140,y+38)}});x.fillStyle='#d8d4ef';x.font='26px system-ui';x.fillText('同频 · 把这一刻保存下来',pad,h-52);c.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='同频战绩-'+state.code+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/png')}
function render(){if(!state)return;$('home').classList.add('hide');$('game').classList.remove('hide');['lobby','writing','reveal','won'].forEach(id=>$(id).classList.toggle('hide',state.phase!==id));$('phaseLabel').textContent={lobby:'等待好友',writing:'秘密输入',reveal:'同时揭晓',won:'挑战成功'}[state.phase];$('roundLabel').textContent=state.round?'第 '+state.round+' 轮':'准备中';if(state.phase==='lobby'){$('inviteCode').textContent=state.code;showPlayers('lobbyPlayers',false);$('lobbyTip').textContent=state.players.length===1?'等待第二位玩家加入…':'两位玩家已到齐！';$('startBtn').classList.toggle('hide',!state.isHost);$('startBtn').disabled=!state.canStart}
if(state.phase==='writing'){showPlayers('writingPlayers',false);renderPrevious();const me=state.players.find(p=>p.isYou);$('word').disabled=me.submitted;$('submitBtn').disabled=me.submitted;$('submitBtn').textContent=me.submitted?'已锁定，等待揭晓 ✓':'锁定我的词语 🔒';$('writingTip').textContent=me.submitted?'提交成功！对方看不到你的词语。':'时间结束时自动揭晓，未提交记为未作答。';if(!me.submitted)$('word').value='';updateTimer()}
if(state.phase==='reveal'){showPlayers('revealPlayers',true);$('revealTitle').textContent='想法不同，再来一轮！';updateTimer()}
if(state.phase==='won'){showPlayers('wonPlayers',true);if(!state.review){const review=funnyReview();state.review=review[1];$('reviewEmoji').textContent=review[0];$('reviewWord').textContent=state.history?.[state.history.length-1]?.words?.[0]||''}$('winMessage').textContent=state.review;$('replayBtn').classList.toggle('hide',!state.isHost)}
if(!timer)timer=setInterval(updateTimer,100)}
function updateTimer(){if(!state)return;if(state.phase==='writing'){const remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));$('countdown').textContent=remain;$('countdown').classList.toggle('urgent',remain<=5)}else if(state.phase==='reveal'){$('nextTip').textContent=Math.max(0,Math.ceil((state.revealUntil-Date.now())/1000))+' 秒后自动进入下一轮…'}}
async function copyInvite(){const url=location.origin+location.pathname+'?room='+state.code;try{await navigator.clipboard.writeText(url);$('lobbyTip').textContent='✓ 邀请链接已复制'}catch{window.prompt('复制这个邀请链接',url)}}
(async()=>{const saved=sessionStorage.getItem('word-sync-token');if(saved){try{const res=await fetch('/api/state?token='+encodeURIComponent(saved));if(!res.ok)throw Error();state=await res.json();token=saved;connect();render()}catch{sessionStorage.removeItem('word-sync-token')}}})();
</script></body></html>
